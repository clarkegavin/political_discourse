pipelines:
  - name: eda
    type: pipelines.eda_pipeline.EDAPipeline
    enabled: false
    params:
      save_path: output/eda
      steps:
      - name: describe_info
        params:
          filename_prefix: oireachtas
        #==============================
        # Oireachtas Document Length EDA - Q&A
        #==============================
      - name: document_length
        params:
          columns:
          - QuestionText
          - AnswerText
          unit: characters
          output_column: character_length
          viz_params:
          - name: histogram
            bins: 30
            xlabel: Character length
            ylabel: Number of documents
            #xscale: log
            density: false
            filename: oireachtas_character_length_histogram.png
          - name: boxplot
            filename: oireachtas_character_length_boxplot.png
#          - name: bar_chart
#            filename: oireachtas_question_character_length_barchart.png
      - name: document_length
        params:
          columns:
          - QuestionText
          - AnswerText
          unit: words
          output_column: word_length
          viz_params:
          - name: histogram
            bins: 30
            xlabel: Word length
            ylabel: Number of documents
            #xscale: log
            density: false
            filename: oireachtas_words_length_histogram.png
          - name: boxplot
            filename: oireachtas_words_length_boxplot.png
      - name: document_length
        params:
          columns:
          - QuestionText
          - AnswerText
          unit: sentences
          output_column: sentence_length
          viz_params:
          - name: histogram
            #bins: 30
            xlabel: Sentence length
            ylabel: Number of documents
            xscale: log
            density: false
            filename: oireachtas_sentence_length_log_histogram.png
          - name: boxplot
            filename: oireachtas_sentence_length_log_boxplot.png
      - name: document_length
        params:
          columns:
            - QuestionText
            - AnswerText
          unit: sentences
          output_column: sentence_length
          viz_params:
            - name: histogram
              bins: 30
              xlabel: Sentence length
              ylabel: Number of documents
              density: false
              filename: oireachtas_sentence_length_histogram.png
            - name: boxplot
              filename: oireachtas_sentence_length_boxplot.png
      # ===============================
      # Oireachtas Question Text EDA - Q only
      # ===============================
      - name: document_length
        params:
          columns:
          - QuestionText
          unit: characters
          output_column: character_length
          viz_params:
          - name: histogram
            bins: 30
            xlabel: Character length
            ylabel: Number of documents
            #xscale: log
            density: false
            filename: oireachtas_question_character_length_histogram.png
          - name: boxplot
            filename: oireachtas_question_character_length_boxplot.png

      # ===============================
      # Oireachtas Question Text EDA - Q only
      # ===============================
      - name: document_length
        params:
          columns:
          - AnswerText
          unit: characters
          output_column: character_length
          viz_params:
          - name: histogram
            bins: 30
            xlabel: Character length
            ylabel: Number of documents
            #xscale: log
            density: false
            filename: oireachtas_answer_character_length_histogram.png
          - name: boxplot
            filename: oireachtas_answer_character_length_boxplot.png
#      - name: sankey_flow
#        params:
#          columns:
#            - QuestionerConstituency
#            - QuestionerParty
#            - QuestionType
#           # - QuestionCategory
#          viz_params:
#            - name: sankey
#              filename: oireachtas_sankey.html
      - name: class_balance
        params:
          #target: null  # When target is null, ClassBalanceEDA will create subplots for all columns
          exclude_columns:
            - QuestionID
            - QuestionNumber
            - QuestionText
            - AnswerText
#          log_transform_columns:
#            - numeric_score
          # Can be an int (global bins) or a dict mapping column->bins
          #hist_bins: 30
          filename: oireachtas_class_balance_overview.png
          #save_path: output/eda
      - name: missing_values
        params:
          columns:
            - Questioner
            - QuestionerParty
            - QuestionerConstituency
            - QuestionType
            - AskedOfMinister
          missing_values_column: AnswerText
          consolidate: true
          ncols: 3
          viz_params:
            name: box_plot
            filename: oireachtas_missing_values_overview.png
      - name: tokenize_text
        params:
          columns:
            - QuestionText
            - AnswerText
          output_column: tokens
          viz_params:
            - name: boxplot
              ncols: 3
              filename: oireachtas_tokens_boxplot.png
            - name: bar_chart
              ncols: 3
              filename: oireachtas_tokens_barchart.png

      # ==========================================
      # Term Frequency EDA - Q&A
      # ==========================================
#      - name: term_frequency
#        params:
#          fields_to_combine: ["QuestionText", "AnswerText"]
#          combined_field_name: "CombinedQA"
#          target_field: "CombinedQA"
#          saver_name: sql_server
#          table_name: oireachtas_term_frequency
#          if_exists: replace
#          chunk_size: 1000
#          schema: dbo
#          connector_params: {}
#          viz_params:
#            - name: zipf_plot
#              log_scale: true
#              filename: oireachtas_term_frequency_zipf_plot.png

      - name: shannon_entropy
        params:
          group_by_field: Questioner
          category_field: QuestionCategory
          normalise: true
          saver_name: sql_server
          table_name: oireachtas_td_entropy
          schema: dbo
          viz_params:
            - name: histogram
              column: NormalisedEntropy
              bins: 20
              title: Distribution of TD Category Diversity
              filename: td_entropy_histogram.png
            - name: pair_scatter
              pairs:
                - [TotalCount, NormalisedEntropy]
              title: TD Question Volume vs Category Diversity
              filename: td_entropy_scatter.png



