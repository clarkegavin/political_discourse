pipelines:
- name: preprocess_boards_data
  type: pipelines.preprocessing_pipeline.PreprocessingPipeline
  enabled: true
  params:
    preprocessors:
      - name: remove_urls
        params:
          columns:
            - DocumentText
      - name: regex_replace # Remove leading question number, parliamentary reference, and consolidated question boilerplate
        params:
          columns:
            - DocumentText

          replacements:
            # Remove leading question number
            - pattern: '^\s*\d+\.\s+'
              replacement: ''

            # Remove parliamentary reference
            - pattern: '\[\d+/\d+\]'
              replacement: ''

            # Remove consolidated question boilerplate
            - pattern: '\s*I propose to take Questions Nos?\..*?together\.\s*'
              replacement: ' '
              ignore_case: true
              dotall: true
      - name: duplicate_column
        params:
          source_column: DocumentText #embeddings are generated from this
          target_column: RepresentationDocument # representations are generated from this
      - name: stopword_remover
        params:
          language: "english"
          lower: true
          columns: [ RepresentationDocument ]
          include_procedural: false
          include_nltk: false
          include_default: true
      - name: lowercase
        params:
          columns: [ RepresentationDocument ]
#      - name: lemmatizer
#        params:
#          columns: [ RepresentationDocument ]
          # remove procedural language
          # remove numeric data at beginning and end of text
