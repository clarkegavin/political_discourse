pipelines:
- name: preprocess_boards_data
  type: pipelines.preprocessing_pipeline.PreprocessingPipeline
  enabled: true
  params:
    preprocessors:
      - name: remove_urls
        params:
          columns: [ QuestionText, AnswerText ]
      - name: stopword_remover
        params:
          language: "english"
          lower: true
          columns: [ QuestionText, AnswerText ]
