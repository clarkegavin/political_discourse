pipelines:
  # ==========================
  # Baseline Reporting
  # =========================
  - name: thesis_reporting
    type: pipelines.thesis_reporting_pipeline.ThesisReportingPipeline
    enabled: true
    params:
      output_path: output/thesis/parliamentary_questions/baseline
      data_builder:
        experiment_id: 502413359867310494
        filter_expression: "tags.mlflow.runName LIKE '%baseline%'"

        fields:
          - field: run_name
            name: Experiment
          - field: run_id
            name: Run ID
          - field: params.embedding_model_model_name
            name: Embedding Model
          - field: metrics.coherence
            name: Coherence
          - field: metrics.coherence_npmi
            name: NPMI
          - field: metrics.topic_diversity
            name: Diversity
          - field: metrics.topic_exclusivity
            name: Exclusivity
          - field: metrics.outlier_ratio
            name: Outliers
      steps:
        - name: latex_summary_table
          params:
            output_file:
              parliamentary_questions_baseline.tex
            caption:
              Baseline embedding model evaluation.
            label:
              tab:baseline_results
            sort:
              field: Coherence
              descending: true
            highlight:
              - field: Coherence
                direction: max
              - field: NPMI
                direction: max
              - field: Diversity
                direction: max
              - field: Exclusivity
                direction: max
              - field: Outliers
                direction: min
            columns:
              - field: Embedding Model
                header: Embedding Model
                latex_type: p{5cm}
              - field: Coherence
                header: Coherence
                latex_type: l
                precision: 3
              - field: NPMI
                header: NPMI
                latex_type: l
                precision: 3
              - field: Diversity
                header: Diversity
                latex_type: l
                precision: 3
              - field: Exclusivity
                header: Exclusivity
                latex_type: l
                precision: 3
              - field: Outliers
                header: Outliers
                latex_type: l
                precision: 3
        - name: grouped_metric_chart
          params:
            x_field: Embedding Model
            inverse_metrics:
              - Outliers
            metrics:
              - Coherence
              - NPMI
              - Diversity
              - Exclusivity
              - Outliers
            filename: baseline_metric_comparison.png

            visualisation:
              name: grouped_bar_chart
              figsize:
                - 10
                - 6
        - name: metric_heatmap
          params:
            index_field: Embedding Model
            metrics:
              - Coherence
              - NPMI
              - Diversity
              - Exclusivity
              - Outliers
            inverse_metrics:
              - Outliers
            filename: baseline_metric_heatmap.png
            visualisation:
              name: metric_heatmap
              figsize:
                - 10
                - 6
        - name: metric_line_chart
          params:
            parameters:
              - n_neighbors
              - n_components
              - min_dist
              - distance_metric

            metrics:
              - Coherence
              - NPMI
              - Diversity
              - Exclusivity
              - Outliers

            inverse_metrics:
              - Outliers

            filename: umap_parameters.png

            visualisation:
              name: metric_line_chart
              figsize: [ 12,8 ]
              rows: 2
              cols: 3
  # ==========================
  # All Components Reporting
  # =========================
  - name: thesis_component_comparison
    type: pipelines.thesis_reporting_pipeline.ThesisReportingPipeline
    enabled: true
    params:
      output_path: output/thesis/parliamentary_questions/all_components
      data_builder:
        experiment_id: 502413359867310494
        derive_component: true
        component_detection:
          UMAP:
            - params.dimensionality_reduction_model_name

          HDBSCAN:
            - params.clusterer_name


          CTFIDF:
            - params.ctfidf_name

          Vectorizer:
            - params.vectorizer_name


          Representation:
            - params.representation_model_name


        fields:
          - field: run_name
            name: Experiment
          - field: run_id
            name: Run ID
          - field: params.embedding_model_model_name
            name: Embedding Model
          - field: metrics.coherence
            name: Coherence
          - field: metrics.coherence_npmi
            name: NPMI
          - field: metrics.topic_diversity
            name: Diversity
          - field: metrics.topic_exclusivity
            name: Exclusivity
          - field: metrics.outlier_ratio
            name: Outliers
          - field: params.dimensionality_reduction_model_params_n_neighbors
            name: n_neighbors
          - field: params.dimensionality_reduction_model_params_n_components
            name: n_components
          - field: params.dimensionality_reduction_model_params_min_dist
            name: min_dist
          - field: params.dimensionality_reduction_model_params_metric
            name: distance_metric
          - field: params.dimensionality_reduction_model_params_random_state
            name: random_state
          - field: params.clusterer_params_min_cluster_size
            name: min_cluster_size
          - field: params.clusterer_params_min_samples
            name: min_samples
          - field: params.ctfidf_params_bm25_weighting
            name: bm25_weighting
          - field: params.ctfidf_params_reduce_frequent_words
            name: reduce_frequent_words
          - field: params.model_params_vectorizer_params_min_df
            name: min_df
          - field: params.model_params_vectorizer_params_ngram_range
            name: ngram_range
          - field: params.representation_model_name
            name: representation_model
          - field: params.representation_model_params_diversity
            name: diversity
          - field: params.representation_model_params_top_n_words
            name: top_n
      steps:
        - name: component_comparison_chart
          params:
            embedding_field: Embedding Model
            component_field: Component
            rank_by: Coherence
            value_field: Coherence
            descending: true
            filename: component_comparison.png

            visualisation:
              name: grouped_bar_chart
              figsize: [ 12, 8 ]
              y_label: Coherence
        - name: metric_strip_chart
          params:
            group_field: Embedding Model

            group_labels:
              sentence-transformers/all-MiniLM-L6-v2: MiniLM
              sentence-transformers/all-roberta-large-v1: RoBERTa
              ddore14/RooseBERT-scr-cased: RooseBERT

            metrics:
              - Coherence
              - NPMI
              - Diversity
              - Exclusivity
              - Outliers

            inverse_metrics:
              - Outliers

            layout: combined

            central_tendency: median

            jitter: 0.08

            rows: 2
            cols: 3

            filename: metric_strip_comparison.png

            visualisation:
              name: metric_strip_plot
              figsize: [ 12, 8 ]
        - name: metric_strip_chart
          params:
            group_field: Embedding Model

            group_labels:
              sentence-transformers/all-MiniLM-L6-v2: MiniLM
              sentence-transformers/all-roberta-large-v1: RoBERTa
              ddore14/RooseBERT-scr-cased: RooseBERT

            metrics:
              - Coherence
              - NPMI
              - Diversity
              - Exclusivity
              - Outliers

            inverse_metrics:
              - Outliers

            layout: combined

            central_tendency: null

            jitter: 0.08

            rows: 2
            cols: 3

            filename: metric_strip_comparison_no_central_tendency.png

            visualisation:
              name: metric_strip_plot
              figsize: [ 12, 8 ]



