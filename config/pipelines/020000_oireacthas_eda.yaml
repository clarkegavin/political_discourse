pipelines:
  - name: eda
    type: pipelines.eda_pipeline.EDAPipeline
    enabled: false
    params:
      save_path: output/eda
      steps:
      - name: describe_info
        params:
          filename_prefix: oireachtas
      - name: document_length
        params:
          columns:
          - QuestionText
          - AnswerText
          unit: characters
          output_column: character_length
          viz_params:
          - name: histogram
            bins: 30
            xlabel: Character length
            ylabel: Number of documents
            #xscale: log
            density: false
            filename: oireachtas_character_length_histogram.png
          - name: boxplot
            filename: oireachtas_character_length_boxplot.png
      - name: document_length
        params:
          columns:
          - QuestionText
          - AnswerText
          unit: words
          output_column: word_length
          viz_params:
          - name: histogram
            bins: 30
            xlabel: Word length
            ylabel: Number of documents
            #xscale: log
            density: false
            filename: oireachtas_words_length_histogram.png
          - name: boxplot
            filename: oireachtas_words_length_boxplot.png
      - name: document_length
        params:
          columns:
          - QuestionText
          - AnswerText
          unit: sentences
          output_column: sentence_length
          viz_params:
          - name: histogram
            #bins: 30
            xlabel: Sentence length
            ylabel: Number of documents
            xscale: log
            density: false
            filename: oireachtas_sentence_length_log_histogram.png
          - name: boxplot
            filename: oireachtas_sentence_length_log_boxplot.png
      - name: document_length
        params:
          columns:
            - QuestionText
            - AnswerText
          unit: sentences
          output_column: sentence_length
          viz_params:
            - name: histogram
              bins: 30
              xlabel: Sentence length
              ylabel: Number of documents
              density: false
              filename: oireachtas_sentence_length_histogram.png
            - name: boxplot
              filename: oireachtas_sentence_length_boxplot.png
      - name: sankey_flow
        params:
          columns:
            - QuestionerConstituency
            - QuestionerParty
            - QuestionType
           # - QuestionCategory
          viz_params:
            - name: sankey
              filename: oireachtas_sankey.html
      - name: class_balance
        params:
          #target: null  # When target is null, ClassBalanceEDA will create subplots for all columns
          exclude_columns:
            - QuestionID
            - QuestionNumber
            - QuestionText
            - AnswerText
#          log_transform_columns:
#            - numeric_score
          # Can be an int (global bins) or a dict mapping column->bins
          #hist_bins: 30
          filename: oireachtas_class_balance_overview.png
          #save_path: output/eda
      - name: missing_values
        params:
          columns:
            - Questioner
            - QuestionerParty
            - QuestionerConstituency
            - QuestionType
            - AskedOfMinister
          missing_values_column: AnswerText
          consolidate: true
          ncols: 3
          viz_params:
            name: box_plot
            filename: oireachtas_missing_values_overview.png
      - name: tokenize_text
        params:
          columns:
            - QuestionText
            - AnswerText
          output_column: tokens
          viz_params:
            - name: boxplot
              ncols: 3
              filename: oireachtas_tokens_boxplot.png
            - name: bar_chart
              ncols: 3
              filename: oireachtas_tokens_barchart.png

