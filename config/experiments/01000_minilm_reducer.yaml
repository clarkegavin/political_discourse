# file: `config/experiments/bertopic_default.yaml`
run_name: "MiniLM_sweep_reducer"
params:
  model_params:
    embedding_model: # optional custom embedding model config
      name: bert
      column: "DocumentText"
      model_name: "sentence-transformers/all-MiniLM-L6-v2"
      chunking:
        enabled: true
        chunk_size: 224
        overlap: 32
        pooling: mean
      cache:
        enabled: true
        id_column: "QuestionId"
        cache_dir: "output/embeddings_cache"
        overwrite: false
      # max_seq_length: 512
    vectorizer:
      name: CountVectorizer
      params: {}
    clusterer:
      name: hdbscan
      params: {}
    dimensionality_reduction_model:
      name: umap
      params: {}
    ctfidf:
      name: class_tfidf
      params: {}
    representation_model:
      name: keybert
      params: {}
save_path: "output/topic_modelling/MiniLM_sweep"
visualisations:
  - name: topic_distribution
    init:
      filename: bertopic_default_topic_distribution.png
  - name: topic_wordclouds
    init:
      filename_prefix: bertopic_default_topic
      top_n_topics: 10
  - name: intertopic_distance
    init:
      filename: intertopic_distance.html
  - name: topic_barchart
    init:
      filename: topic_barchart.html
      # BERTopic parameters
      top_n_topics: 10
      n_words: 10
      width: 350
      height: 350
      topics: null        # optional list of topic ids
  - name: topic_heatmap
    init:
      filename: topic_heatmap.html
  - name: topic_term_rank
    init:
      filename: topic_term_rank.html
#  - name: topic_documents
#    init:
#      filename: topic_documents.html
  - name: topic_hierarchy
    init:
      filename: topic_hierarchy.html
  - name: topics_over_time
    init:
      filename: topics_over_time.html
      date_column: QuestionDate
      text_column: RepresentationDocument
      interval: month
  - name: topics_per_class
    init:
      filename: topics_per_party.html
      classes_column: QuestionerParty
      text_column: RepresentationDocument
      top_n_topics: 10
  - name: topics_per_class
    init:
      filename: topics_per_constituency.html
      classes_column: QuestionerConstituency
      text_column: RepresentationDocument
      top_n_topics: 10
  - name: topics_per_class
    init:
      filename: topics_per_td.html
      classes_column: Questioner
      text_column: RepresentationDocument
      top_n_topics: 10

sweep:
  params.model_params.dimensionality_reduction_model:
    - name: umap
      params:
         n_neighbors: [ 5, 15, 30 ]
         n_components: [ 5, 10, 25 ]
         metric: [ cosine, euclidean ]
         min_dist: [ 0.0, 0.1]
         random_state: [ 42 ]
