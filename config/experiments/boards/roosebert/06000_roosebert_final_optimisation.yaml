sweep:
  params.model_params.dimensionality_reduction_model:
    - name: umap
      params:
        n_neighbors: [ 5 ]
        n_components: [ 5 ]
        metric: [ euclidean, cosine ]
        min_dist: [ 0.0, 0.1 ]
        random_state: [ 42 ]
  params.model_params.clusterer.params.min_cluster_size: [ 5, 10 ]
  params.model_params.clusterer.params.min_samples: [ 1, 5 ]
  params.model_params.vectorizer.params.ngram_range: [ [ 1, 1 ] ]
  params.model_params.vectorizer.params.min_df: [ 1, 5 ]
  params.model_params.ctfidf.params.bm25_weighting: [ true, false ]
  params.model_params.ctfidf.params.reduce_frequent_words: [ true ]
  params.model_params.representation_model:
    - name: mmr
      params:
        diversity: [ 0.1, 0.3 ]