# file: `config/experiments/bertopic_default.yaml`
run_name: "RooseBERT_sweep"
params:
  model_params:
    embedding_model: # optional custom embedding model config
      name: bert
      column: "DocumentText"
      batch_size: 32
      device: cuda
      model_name: "ddore14/RooseBERT-scr-cased"
      chunking:
        enabled: true
        chunk_size: 224
        overlap: 32
        pooling: mean
      cache:
        enabled: true
        id_column: "DocumentId"
        cache_dir: "output/embeddings_cache/final_optimisation"
        overwrite: false
      # max_seq_length: 512
    dimensionality_reduction_model:
      name: umap
      params: { }
    clusterer:
      name: hdbscan
      params: { }
    vectorizer:
      name: CountVectorizer
      params: { }
    ctfidf:
      name: class_tfidf
      params: { }
    representation_model:
      name: mmr
      params: { }
save_path: "output/topic_modelling/boards/RooseBERT_sweep"
