# file: `config/experiments/bertopic_default.yaml`
run_name: "RoBERTa_baseline"
params:
  model_params:
    embedding_model: # optional custom embedding model config
      name: bert
      column: "DocumentText" #embeddings are created from this column
      batch_size: 32
      device: cuda
      model_name: "sentence-transformers/all-roberta-large-v1"
      chunking:
        enabled: true
        chunk_size: 224
        overlap: 32
        pooling: mean
      cache:
        enabled: true # if true, then cached embeddings will be used if available, otherwise embeddings will be generated and cached
        id_column: "QuestionId"
        cache_dir: "output/embeddings_cache/final_optimisation"
        overwrite: true
save_path: "output/topic_modelling/RoBERTa_baseline"
