# file: `config/experiments/minlm/07000_minilm_selectded_model.yaml`
run_name: "MiniLM"
params:
  model_params:
    embedding_model:
      name: bert # transformer model for generating embeddings
      column: "DocumentText"
      batch_size: 32
      device: cuda # utilize GPU if available
      model_name: "sentence-transformers/all-MiniLM-L6-v2" # specific model to use for generating embeddings
      chunking: # chunking parameters for handling long documents
        enabled: true
        chunk_size: 224
        overlap: 32
        pooling: mean
      cache: # caching parameters for storing embeddings to avoid recomputation
        enabled: true
        id_column: "QuestionId"
        cache_dir: "output/embeddings_cache/selected_model"
        overwrite: true # true to overwrite existing cache, false to append new embeddings
    dimensionality_reduction_model:
      name: umap
      params: {}
save_path: "output/topic_modelling/pq_selected_model"
visualisations: # visualisation parameters for topic modelling outputs
  - name: topic_distribution
    init:
      filename: bertopic_default_topic_distribution.png
  - name: topic_wordclouds
    init:
      filename_prefix: bertopic_default_topic
      top_n_topics: 10
  - name: intertopic_distance
    init:
      filename: intertopic_distance.html
  - name: topic_barchart
    init:
      filename: topic_barchart.html
      top_n_topics: 10
      n_words: 10
      width: 350
      height: 350
      topics: null  # optional list of topic ids
  - name: topic_tree
    init:
      filename: topic_tree.txt
      max_distance: null
      tight_layout: true
      text_column: RepresentationDocument
  - name: topic_heatmap
    init:
      filename: topic_heatmap.html
  - name: topic_term_rank
    init:
      filename: topic_term_rank_scaled.html
      log_scale: true
  - name: topic_term_rank
    init:
      filename: topic_term_rank.html
  - name: topic_documents
    init:
      filename: topic_documents.html
  - name: topic_hierarchy
    init:
      filename: topic_hierarchy.html
      orientation: left
      top_n_topics: null
  - name: hierarchical_documents
    init:
      filename: hierarchical_documents.html
      width: 1200
      height: 800
      hide_annotations: false
      text_column: RepresentationDocument
  - name: topics_over_time
    init:
      filename: topics_over_time.html
      date_column: QuestionDate
      text_column: RepresentationDocument
      interval: month
  - name: topics_per_class
    init:
      filename: topics_per_party.html
      classes_column: QuestionerParty
      text_column: RepresentationDocument
      top_n_topics: 10
  - name: topics_per_class
    init:
      filename: topics_per_constituency.html
      classes_column: QuestionerConstituency
      text_column: RepresentationDocument
      top_n_topics: 10
  - name: topics_per_class
    init:
      filename: topics_per_td.html
      classes_column: Questioner
      text_column: RepresentationDocument
      top_n_topics: 10
  - name: approximate_distribution
    init:
      filename: approximate_distribution.html
      batch_size: 1000
      top_n_topics: 20
      text_column: RepresentationDocument
topic_outputs: # output parameters for saving topic modelling results
  enabled: true
  save_topic_info: true
  save_topic_hierarchy: true

  topic_info_output: # output topic info data to database
    saver_name: sql_server
    table_name: oireachtas_topic_info
    if_exists: replace
    chunk_size: 1000
    schema: dbo
    connector_params: { }

  hierarchy_output: # output topic hierarchy data to database
    saver_name: sql_server
    table_name: oireachtas_topic_hierarchy
    if_exists: replace
    chunk_size: 1000
    schema: dbo
    connector_params: { }

  hierarchy_nodes_output: # output topic hierarchy nodes data to database
    saver_name: sql_server
    table_name: oireachtas_topic_hierarchy_nodes
    if_exists: replace
    chunk_size: 1000
    schema: dbo
    connector_params: { }
llm: # parameters for LLM-based topic interpretation
  enabled: true
  provider: openai
  model: gpt-5.4-mini

  prompt_type: parliamentary_questions

  max_representative_docs: 3
  max_doc_characters: 1500
  max_ancestors: 3

  max_topics: null # maximum number of topics to interpret, null for all topics

  # Optional parameters for controlling the LLM request behavior
  request_delay_seconds: 0.5
  max_retries: 5
  retry_delay: 2.0

  # Optional parameters for controlling the LLM output behavior
  llm_output:
    saver_name: sql_server
    table_name: oireachtas_topic_llm
    if_exists: replace
    chunk_size: 1000
    schema: dbo
    connector_params: { }
sweep: # parameters for hyperparameter sweep experiments
  params.model_params.dimensionality_reduction_model:
    - name: umap
      params:
         n_neighbors: [ 30 ]
         n_components: [ 25 ]
         metric: [ euclidean ]
         min_dist: [ 0.0 ]
         random_state: [ 42 ]

