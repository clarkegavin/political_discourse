# file: `config/experiments/bertopic_default.yaml`
run_name: "MiniLM_sweep_vectorizer_delete"
params:
  model_params:
    embedding_model: # optional custom embedding model config
      name: bert
      column: "DocumentText"
      batch_size: 32
      device: cuda
      model_name: "sentence-transformers/all-MiniLM-L6-v2"
      chunking:
        enabled: true
        chunk_size: 224
        overlap: 32
        pooling: mean
      cache:
        enabled: true
        id_column: "QuestionId"
        cache_dir: "output/embeddings_cache"
        overwrite: true
      # max_seq_length: 512
    vectorizer:
      name: CountVectorizer
      params: {}
save_path: "output/topic_modelling/MiniLM_sweep"

sweep:
  params.model_params.vectorizer.params.ngram_range: [ [1, 1] ]

