pipelines:
  - name: preprocess_boards_data
    type: pipelines.preprocessing_pipeline.PreprocessingPipeline
    enabled: true
    params:
      preprocessors:
        - name: reply_reference_extractor
          params:
            columns: [CommentBody]
            output_column: "ReplyToIds"
            extract_multiple: true
        - name: reply_graph_builder
          params: {}

  - name: save_extracted_table
    type: pipelines.data_saver_pipeline.DataSaverPipeline
    enabled: true
    params:
      saver_name: sql_server
      table_name: boards_conceptual_model
      if_exists: replace
      chunk_size: 1000
      schema: dbo
      connector_params: {}
