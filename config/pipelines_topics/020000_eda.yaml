pipelines:
  - name: eda
    type: pipelines.eda_pipeline.EDAPipeline
    enabled: true
    params:
      save_path: output/eda/llm_topics

      steps:
#        - name: topic_attribute_analysis
#          params:
#            topic_field: Topic
#            topic_theme_field: TopicTheme
#            attributes:
#              - Questioner
#              - QuestionerParty
