#-------------------------------------------------------------------------------
# Merge boards discussions and comments tables using an inner join on the discussion ID fields
# This is a one off as we will save the output as a new consolidated table in the DB
#-------------------------------------------------------------------------------

  # Merge dbo.discussions with dbo.comments example
  - name: discussions_comments_merge
    type: pipelines.merge_pipeline.MergeTablesPipeline
    enabled: false
    params:
      # Left: discussions table
      left:
        extractor_type: table
        extractor_params:
          model: BoardsDiscussion
      # Right: comments table
      right:
        extractor_type: table
        extractor_params:
          model: BoardsComment
      # Asymmetric join: DiscussionID on left vs discussionID on right
      left_on: ["DiscussionID"]
      right_on: ["CommentDiscussionID"]
      left_fields:
        DiscussionId: DiscussionID
        Type: DiscussionType
        Title: DiscussionTitle
        Body: DiscussionBody
        CategoryId: DiscussionCategoryID
        DateInserted: DiscussionDateInserted
        DateUpdated: DiscussionDateUpdated
        DateLastComment: DiscussionDateLastComment
        insertUserId: DiscussionInsertUserID
        UpdateUserId: DiscussionUpdateUserID
        LastUserId: DiscussionLastUserID
        Closed: DiscussionClosed
        countComments: DiscussionCountComments
        CanonicalURL: DiscussionCanonicalUrl
      # include 'discussionID' here so it is available for the join (note camel/lowercase difference)
      right_fields:
        Id: Id
        commentID: CommentID
        discussionID: CommentDiscussionID
        name: CommentName
        categoryID: CommentCategoryID
        body: CommentBody
        dateInserted: CommentDateInserted
        dateUpdated: CommentDateUpdated
        updateUserID: CommentUpdateUserID
        score: CommentScore
        depth: CommentDepth
        scoreChildComments: CommentScoreChildComments
        countChildComments: CommentCountChildComments
        url: CommentUrl
      how: inner

  - name: save_extracted_table
    type: pipelines.data_saver_pipeline.DataSaverPipeline
    enabled: false
    params:
      saver_name: sql_server
      table_name: consolidated_boards
      if_exists: replace
      chunk_size: 1000
      schema: dbo
      connector_params: {}


