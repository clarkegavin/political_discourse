#--------------------------------------------------------------------------
# EDA on boards discussions
#--------------------------------------------------------------------------
  - name: boards_consolidated_data
    type: pipelines.data_extractor_pipeline.DataExtractorPipeline
    enabled: false
    extractor_type: table
    params:
      extractor_params:
        model: BoardsConsolidated
#        filters:
#          QuestionDate:
#            from: "2025-01-01"
#            to: "2025-12-31"


  - name: preprocess_boards_data
    type: pipelines.preprocessing_pipeline.PreprocessingPipeline
    enabled: false
    params:
      preprocessors:
        - name: remove_html_tags
          params:
            columns: ["DiscussionBody", "CommentBody"]
        - name: lowercase
          params:
            columns: ["DiscussionBody", "CommentBody"]
        - name: remove_punctuation_noise
          params:
              columns: ["DiscussionBody", "CommentBody"]
        - name: remove_urls
          params:
            columns: ["DiscussionBody", "CommentBody"]
        - name: numeric_normaliser # imputes a placeholder token for numeric values to reduce noise in topic modelling
          params:
            columns: [ "DiscussionBody", "CommentBody" ]
        - name: remove_repeated_characters # reduces character repetition to a max of 3 to reduce noise in topic modelling (e.g. coooool -> cooool)
          params:
            columns: [ "DiscussionBody", "CommentBody" ]
        - name: date_normaliser # normalises date expressions to a common placeholder token to reduce noise in topic modelling
          params:
            columns: [ "DiscussionBody", "CommentBody" ]
        - name: combine_text
          type: preprocessing.combine_aggregate_text.CombineOrAggregateText
          params:
            fields_to_combine: [ "DiscussionBody", "CommentBody" ]
            combined_field_name: "CombinedBody"

