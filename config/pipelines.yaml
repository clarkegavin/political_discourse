  # Sample Topic Modelling pipeline using BERTopic
  - name: topic_modeling_bertopic
    type: pipelines.topic_modeling_pipeline.TopicModelingPipeline
    enabled: true
    params:
      model_name: bertopic
      evaluator_name: topic_modeling
      mlflow_experiment: topic_modelling
      default_text_field: ["QuestionText", "AnswerText"]
      combined_text_field_name: "CombinedText" # new field that combines text from default_text_field for embedding/vectorization
      experiments:
        - run_name: bertopic_default
          params:
            model_params:
              nr_topics: null
              min_topic_size: 10
              embedding_model: "all-MiniLM-L6-v2"  # sentence-transformers model for embedding generation, gets passed to BERTopic as the embedding_model parameter - can be a string model name or a custom embedding model config dict (see below)
#              vectorizer:  # optional vectorizer config for non-bertopic models
#                name: bert
#                column: "CombinedText"
#                model_name: "all-MiniLM-L6-v2"
#                params:
#                  max_features: 20000
            save_path: output/topic_modelling/bertopic_default
          preprocessing:
            - name: remove_urls
              params:
                columns: ["QuestionText", "AnswerText"]
          visualisations:
            - name: topic_distribution
              output_dir: output/topic_modelling/bertopic_default
              filename: "bertopic_default_topic_distribution.png"
            - name: topic_wordclouds
              output_dir: output/topic_modelling/bertopic_default
              filename_prefix: "bertopic_default_topic"
              top_n_topics: 10
        - run_name: bertopic_e5
          params:
            model_params:
              nr_topics: null
              min_topic_size: 10
            embedding_model:  # optional custom embedding model config
              name: bert
              column: "CombinedText"
              model_name: "intfloat/e5-base-v2"
              params:
                prefix: "passage" # e5 models require a prefix to be added to the text for embedding generation
            save_path: output/topic_modelling/bertopic_e5
          preprocessing:
            - name: remove_urls
              params:
                columns: ["QuestionText", "AnswerText"]
            - name: stopword_remover
              params:
                language: "english"
                lower: true
                columns: ["QuestionText", "AnswerText"]
          visualisations:
            - name: topic_distribution
              output_dir: output/topic_modelling/bertopic_e5
              filename: "bertopic_default_topic_distribution.png"
            - name: topic_wordclouds
              output_dir: output/topic_modelling/bertopic_e5
              filename_prefix: "bertopic_default_topic"
              top_n_topics: 10

